version = "1.0"

[metadata]

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[environment.env]
POCHI_LOG = "debug"
WORKOS_API_KEY = "${WORKOS_API_KEY}"
WORKOS_CLIENT_ID = "${WORKOS_CLIENT_ID}"
WORKOS_WEBHOOK_SECRET = "${WORKOS_WEBHOOK_SECRET}"
DATABASE_URL = "postgres://testuser:testpass@localhost:5432/testdb"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 600.0

[verifier.env]
POCHI_LOG = "debug"
WORKOS_API_KEY = "${WORKOS_API_KEY}"
WORKOS_CLIENT_ID = "${WORKOS_CLIENT_ID}"
WORKOS_WEBHOOK_SECRET = "${WORKOS_WEBHOOK_SECRET}"
DATABASE_URL = "postgres://testuser:testpass@localhost:5432/testdb"

[solution.env]
